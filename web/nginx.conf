server {
    listen ${PORT};
    root /usr/share/nginx/html;

    # קבצים עם hash בשם - אפשר לשמור במטמון לתמיד
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: כל נתיב לא מוכר חוזר ל-index.html (כמו ה-rewrite ב-vercel.json)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
