# Render Blueprint - שרת ה-API של OpuLi. מסד הנתונים הוא Supabase Postgres
# (לא Render), והאתר עצמו ב-Vercel. ערכי sync:false מוזנים ידנית ב-Render.
services:
  - type: web
    name: opuli-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SECRET
        generateValue: true
